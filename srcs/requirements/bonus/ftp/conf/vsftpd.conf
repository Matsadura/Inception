listen=YES
listen_port=FTP_PORT_PLACEHOLDER
listen_ipv6=NO
connect_from_port_20=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
pasv_enable=YES
pasv_min_port=PASV_MIN_PORT_PLACEHOLDER
pasv_max_port=PASV_MAX_PORT_PLACEHOLDER
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
file_open_mode=0666
local_umask=002